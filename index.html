<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Für unser Baby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3EA;
    --cream-deep:#F3E6D6;
    --sage:#8FA878;
    --sage-deep:#6F8A5C;
    --mustard:#E3A857;
    --mustard-deep:#C98C3B;
    --terracotta:#C1613C;
    --terracotta-deep:#A44E2E;
    --plum:#8B5A6B;
    --plum-deep:#714659;
    --ink:#4A3A2F;
    --ink-soft:#8A7A6B;
    --line:#E4D5C3;
    --card:#FFFDF9;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Nunito Sans', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    margin:0;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:56px 20px 80px;
    position:relative;
  }

  /* ---- Poll ---- */
  .poll{
    background:var(--card);
    border-radius:28px;
    padding:32px 28px;
    box-shadow:0 2px 24px rgba(74,58,47,0.06);
    border:1px solid var(--line);
    margin-bottom:40px;
  }
  .poll h2{
    font-size:22px;
    text-align:center;
    font-style:normal;
  }
  .poll .sub{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    margin-top:6px;
    margin-bottom:24px;
  }
  .poll-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .poll-btn{
    border:2px solid transparent;
    border-radius:20px;
    padding:22px 12px;
    font-family:'Fraunces', serif;
    font-size:19px;
    font-weight:500;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .poll-btn:hover{transform:translateY(-2px);}
  .poll-btn:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .poll-btn .dot{width:34px;height:34px;border-radius:50%;}
  .poll-btn.girl{background:#FBF0DF;color:var(--mustard-deep);}
  .poll-btn.girl .dot{background:var(--mustard);}
  .poll-btn.boy{background:#F3E4E1;color:var(--plum-deep);}
  .poll-btn.boy .dot{background:var(--plum);}
  .poll-btn.selected{border-color:currentColor;}

  .poll-thanks{
    text-align:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:18px;
    color:var(--sage-deep);
    padding:14px 0;
  }

  .guess-form{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .guess-form input{
    width:100%;
    padding:12px 14px;
    border-radius:14px;
    border:1.5px solid var(--line);
    font-family:'Nunito Sans', sans-serif;
    font-size:15px;
    background:var(--cream);
  }
  .guess-form input:focus{
    outline:none;
    border-color:var(--plum);
  }
  .guess-submit{
    border:none;
    background:var(--plum);
    color:#fff;
    font-family:'Nunito Sans', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:12px 0;
    border-radius:30px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .guess-submit:hover{background:var(--plum-deep);}
  .guess-submit:disabled{background:var(--line); color:var(--ink-soft); cursor:default;}
  .guess-submit:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}

  /* ---- List ---- */
  .list-heading{
    margin-bottom:20px;
  }
  .list-heading h2{
    font-size:24px;
    font-style:normal;
  }
  .list-heading p{
    color:var(--ink-soft);
    font-size:14px;
    margin-top:6px;
  }

  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:12px;
    transition:opacity 0.4s ease, transform 0.4s ease;
  }
  #listContainer{
    margin-bottom:40px;
  }
  .item.reserved{
    opacity:0.5;
  }
  .item-name{
    font-size:16px;
    font-weight:600;
  }
  .item.reserved .item-name{
    text-decoration:line-through;
    text-decoration-color:var(--sage-deep);
    color:var(--ink-soft);
    font-weight:400;
  }
  .item-status{
    font-size:12px;
    color:var(--sage-deep);
    margin-top:2px;
  }
  .reserve-btn{
    flex-shrink:0;
    border:none;
    background:var(--terracotta);
    color:#fff;
    font-family:'Nunito Sans', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px 18px;
    border-radius:30px;
    cursor:pointer;
    transition:background 0.15s ease;
    white-space:nowrap;
  }
  .reserve-btn:hover{background:var(--terracotta-deep);}
  .reserve-btn.selected{background:var(--sage);}
  .reserve-btn.selected:hover{background:var(--sage-deep);}
  .reserve-btn:disabled{
    background:var(--line);
    color:var(--ink-soft);
    cursor:default;
  }
  .reserve-btn:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}

  .loading, .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:24px 0;
    font-size:14px;
  }

  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    margin-top:48px;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="list-heading">
    <h2>Unsere Wunschliste</h2>
    <p>Falls du uns etwas schenken möchtest, freuen wir uns über:</p>
  </div>

  <div id="listContainer">
    <div class="loading">Liste wird geladen …</div>
  </div>

  <div class="poll" id="poll">
    <h2>Was denkst du? Baby wird ein ...</h2>
    <div class="poll-options" id="pollOptions">
      <button class="poll-btn girl" data-guess="Mädchen">
        <span class="dot"></span> Mädchen
      </button>
      <button class="poll-btn boy" data-guess="Junge">
        <span class="dot"></span> Junge
      </button>
    </div>
  </div>

  <div class="poll" id="nameGuessBox">
    <h2>Baby wird wahrscheinlich ... heissen.</h2>
    <div class="guess-form">
      <input type="text" id="nameGuessValue" placeholder="Dein Tipp" maxlength="60">
    </div>
  </div>

  <div class="poll" id="dateGuessBox">
    <h2>Baby wird am ... zur Welt kommen.</h2>
    <div class="guess-form">
      <input type="text" id="dateGuessValue" placeholder="Datum und Uhrzeit" maxlength="60">
    </div>
  </div>

  <div class="poll" id="finalBox">
    <h2>Zum Schluss</h2>
    <div class="guess-form">
      <input type="text" id="finalName" placeholder="Dein Name" maxlength="60">
      <button class="guess-submit" id="finalSubmit">Abschicken</button>
    </div>
    <div class="poll-thanks" id="finalThanks" hidden></div>
  </div>

  <footer>Danke, wir freuen uns auf dich ♡<br>Philipp, Lisa &amp; Baby</footer>
</div>

<script>
/* ================= KONFIGURATION ================= */
const WORKER_URL = "https://babygallo-worker.phi-pla.workers.dev"; // <- URL deines Cloudflare Workers
const GITHUB_OWNER = "pheipen";
const GITHUB_REPO = "babygallo";

/* Die Geschenkliste. Einfach hier ergänzen/ändern. */
const ITEMS = [
  "Babywalz Gutschein",
  "Galaxus Gutschein",
  "Baby Apotheke",
  "Elektrische Nagelfeile",
  "Krabbeldecke",
  "Koala CUDDLE BAND 2 Babytragetuch",
];
/* =================================================== */

let reservedNames = new Set();
let selectedItem = null;
let selectedGuess = null;

async function loadReservations(){
  try{
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues?labels=reservation&state=open&per_page=100`);
    if(!res.ok) throw new Error("GitHub API Fehler");
    const issues = await res.json();
    reservedNames = new Set(
      issues
        .map(i => i.title || "")
        .filter(t => t.startsWith("Reserviert: "))
        .map(t => t.replace("Reserviert: ", "").trim())
    );
  }catch(e){
    console.error(e);
    reservedNames = new Set();
  }
  renderList();
}

function renderList(){
  const container = document.getElementById("listContainer");
  const sorted = [...ITEMS].sort((a,b) => {
    const ra = reservedNames.has(a), rb = reservedNames.has(b);
    if(ra === rb) return 0;
    return ra ? 1 : -1;
  });

  container.innerHTML = "";
  sorted.forEach(name => {
    const isReserved = reservedNames.has(name);
    const isSelected = selectedItem === name;
    const el = document.createElement("div");
    el.className = "item" + (isReserved ? " reserved" : "");
    let btnLabel = "Ich besorge das";
    if(isReserved) btnLabel = "Vergeben";
    else if(isSelected) btnLabel = "Ausgewählt ✓";
    el.innerHTML = `
      <div>
        <div class="item-name">${escapeHtml(name)}</div>
        ${isReserved ? '<div class="item-status">Bereits reserviert</div>' : ''}
      </div>
      <button class="reserve-btn${isSelected ? " selected" : ""}" ${isReserved ? "disabled" : ""}>${btnLabel}</button>
    `;
    if(!isReserved){
      el.querySelector(".reserve-btn").addEventListener("click", () => {
        selectedItem = isSelected ? null : name;
        renderList();
      });
    }
    container.appendChild(el);
  });
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ---- Geschlecht-Auswahl (lokal, wird erst beim Abschicken übermittelt) ---- */
document.querySelectorAll(".poll-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const guess = btn.dataset.guess;
    selectedGuess = selectedGuess === guess ? null : guess;
    document.querySelectorAll(".poll-btn").forEach(b => {
      b.classList.toggle("selected", b.dataset.guess === selectedGuess);
    });
  });
});

/* ---- Gesammeltes Abschicken ---- */
document.getElementById("finalSubmit").addEventListener("click", async () => {
  const name = document.getElementById("finalName").value.trim();
  const nameGuess = document.getElementById("nameGuessValue").value.trim();
  const dateGuess = document.getElementById("dateGuessValue").value.trim();

  if(!name){
    alert("Bitte gib deinen Namen ein.");
    return;
  }
  if(!selectedItem && !selectedGuess && !nameGuess && !dateGuess){
    alert("Bitte wähle oder tippe zuerst etwas aus.");
    return;
  }

  const btn = document.getElementById("finalSubmit");
  btn.disabled = true;
  btn.textContent = "Wird gespeichert …";

  try{
    const payloads = [];
    if(selectedItem){
      payloads.push({ type: "reservation", itemName: selectedItem, personName: name });
    }
    if(selectedGuess){
      payloads.push({ type: "poll", category: "Geschlecht", guess: selectedGuess, personName: name });
    }
    if(nameGuess){
      payloads.push({ type: "poll", category: "Name", guess: nameGuess, personName: name });
    }
    if(dateGuess){
      payloads.push({ type: "poll", category: "Geburtstermin", guess: dateGuess, personName: name });
    }

    for(const payload of payloads){
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      if(!res.ok){
        const errText = await res.text();
        throw new Error(`Fehler beim Speichern (${payload.type}/${payload.category || ""}): ${errText}`);
      }
    }

    if(selectedItem){
      reservedNames.add(selectedItem);
      selectedItem = null;
    }
    renderList();

    document.getElementById("finalBox").querySelector(".guess-form").hidden = true;
    const thanks = document.getElementById("finalThanks");
    thanks.hidden = false;
    thanks.textContent = `Danke, ${name}! Deine Auswahl ist gespeichert.`;
  }catch(e){
    alert("Da ist etwas schiefgelaufen. Bitte versuch es nochmal.");
    console.error(e);
  }finally{
    btn.disabled = false;
    btn.textContent = "Abschicken";
  }
});

loadReservations();
</script>

</body>
</html>
